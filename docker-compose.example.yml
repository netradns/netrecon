# NetRecon — Docker Compose (simplest setup)
#
# Quick start:
#   docker compose up -d
#   Open http://localhost:8085 (or http://<this-server's-IP>:8085)
#   Complete the setup wizard in your browser
#
# No domain, certificate or proxy is needed. All configuration is done in the web UI.
#
# Want HTTPS or a domain name? Use one of these instead:
#   docker-compose.traefik.example.yml   you already run Traefik
#   docker-compose.caddy.example.yml     automatic HTTPS in one step
# Using a cloud load balancer (AWS, Google Cloud, Azure)? See docs/DEPLOYMENT.md.
services:
  netrecon:
    image: ghcr.io/netradns/netrecon:latest
    container_name: netrecon
    restart: unless-stopped
    ports:
      - "8085:80"           # Change 8085 to any available port
    networks:
      - netrecon-internal
    depends_on:
      - dns-proxy
    # Only needed when a load balancer with a PUBLIC address sits in front, for example
    # Google Cloud. Proxies on private addresses (Traefik, Caddy, AWS ALB, Azure) work
    # without it. See docs/DEPLOYMENT.md.
    # environment:
    #   TRUSTED_PROXIES: "35.191.0.0/16,130.211.0.0/22"

  dns-proxy:
    image: ghcr.io/netradns/netrecon-dns-proxy:latest
    container_name: netrecon-dns-proxy
    restart: unless-stopped
    volumes:
      - netrecon-data:/data   # Settings, stats and watched domains live here
    networks:
      - netrecon-internal
    expose:
      - "3053"

volumes:
  netrecon-data:              # A named volume avoids folder-permission problems

networks:
  netrecon-internal:
    driver: bridge
