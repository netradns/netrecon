# NetRecon — Docker Compose
#
# Quick start:
#   mkdir -p ./data
#   docker compose up -d
#   Open http://localhost:8085
#   Complete the setup wizard in your browser
#
# All configuration is done via the web UI — no environment
# variables need to be set. The setup wizard runs on first launch.

services:

  netrecon:
    image: ghcr.io/netradns/netrecon:latest
    container_name: netrecon
    restart: unless-stopped
    ports:
      - "8085:80"           # Change 8085 to any available port
    networks:
      - netrecon-internal
    depends_on:
      - dns-proxy

  dns-proxy:
    image: ghcr.io/netradns/netrecon-dns-proxy:latest
    container_name: netrecon-dns-proxy
    restart: unless-stopped
    volumes:
      - ./data:/data        # Settings, stats, and watched domains persist here
    networks:
      - netrecon-internal
    expose:
      - "3053"

networks:
  netrecon-internal:
    driver: bridge
