services:

  # ── Main app (nginx serving static frontend) ───────────────
  netrecon:
    image: ghcr.io/netradns/netrecon:latest
    container_name: netrecon
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "4"
    ports:
      - "8085:80"
    networks:
      - netrecon-internal
    depends_on:
      - dns-proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  # ── DNS proxy sidecar ──────────────────────────────────────
  # Handles all DNS resolution (public + internal) and stats.
  # Only reachable via nginx on the internal network — never
  # exposed to the host.
  dns-proxy:
    image: ghcr.io/netradns/netrecon-dns-proxy:latest
    container_name: netrecon-dns-proxy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "4"
    volumes:
      - ./data:/data
    networks:
      - netrecon-internal
    expose:
      - "3053"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"

networks:
  netrecon-internal:
    driver: bridge
