# ── NetRecon — nginx Configuration ───────────────────────────────
# Serves the static frontend and reverse-proxies /api/* to dns-proxy.
#
# Security hardening applied:
#   - server_tokens off          (no nginx version in headers/errors)
#   - X-Frame-Options            (clickjacking protection)
#   - X-Content-Type-Options     (MIME sniffing protection)
#   - Referrer-Policy            (privacy)
#   - Content-Security-Policy    (XSS mitigation)
#   - Rate limiting on all API endpoints
#   - client_max_body_size 4k    (prevents large request abuse)

worker_processes auto;  # Automatically match CPU core count

events {
    worker_connections 1024;  # Max simultaneous connections per worker
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;           # Efficient file serving via kernel
    keepalive_timeout 65;       # Keep connections alive for 65s
    server_tokens off;          # Don't expose nginx version in headers

    # ── Request size limits ───────────────────────────────────────
    # The frontend only sends small JSON bodies to /api/* endpoints.
    # 4k is generous — actual payloads are <1k.
    client_max_body_size    4k;
    client_body_buffer_size 4k;

    # ── Rate limiting ─────────────────────────────────────────────
    # 10 requests/second per IP with a 10MB zone (~160k IPs).
    # Individual endpoints set their own burst limits below.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # Separate zone for blacklist + TLS checks — these fire after the main
    # DNS lookup which already consumes most of the 'api' zone burst.
    limit_req_zone $binary_remote_addr zone=checks:10m rate=5r/s;

    # ── Compression ───────────────────────────────────────────────
    # Compress text assets. Saves ~70% on JS/CSS transfer size.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 256;  # Don't compress tiny responses
    gzip_vary on;         # Tell proxies this response varies by Accept-Encoding

    server {
        listen 80 default_server;
        server_name _;
        root  /usr/share/nginx/html;
        index index.html;

        # ── Security headers ──────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Content Security Policy:
        #   - default-src 'self'          only load from same origin
        #   - script-src                  allow CDN scripts (Leaflet, SheetJS)
        #   - style-src                   allow Google Fonts + CDN styles
        #   - font-src                    Google Fonts only
        #   - connect-src 'self'          all API calls go through this server
        #   - img-src                     allow map tiles from OpenStreetMap
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.sheetjs.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org;" always;

        # ── Static frontend ───────────────────────────────────────
        location = / { try_files /index.html =404; }
        # /admin replaces /stats — both paths serve admin.html for backwards compat
        location = /admin { try_files /admin.html =404; }
        location = /stats { try_files /admin.html =404; }
        location / { try_files $uri $uri/ /index.html; }

        # ── API: App configuration (password hash for stats login) ──
        # GET /api/app-config — returns non-sensitive runtime config.
        # The stats password hash is served here so the frontend can
        # validate login without the plaintext password ever being sent.
        location = /api/app-config {
            proxy_pass http://dns-proxy:3053/app-config;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 5s;
            proxy_connect_timeout 5s;
            add_header Cache-Control "no-store";
        }

        # ── API: Setup wizard (first-run only) ────────────────────
        # GET  /api/setup/status — check if setup is complete
        # POST /api/setup        — submit initial configuration
        location = /api/setup/status {
            proxy_pass http://dns-proxy:3053/setup/status;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 5s;
            proxy_connect_timeout 5s;
            add_header Cache-Control "no-store";
        }
        location = /api/setup {
            limit_req zone=api burst=5 nodelay;
            proxy_pass http://dns-proxy:3053/setup;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 5s;
            proxy_connect_timeout 5s;
            add_header Cache-Control "no-store";
        }

        # ── API: Internal DNS (stats, health, resolve) ────────────
        # Rewrites /api/internal-dns/X → /X on the dns-proxy.
        # Used by: stats page, internal DNS tool, proxy health check.
        location /api/internal-dns/ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/internal-dns/(.*) /$1 break;
            proxy_pass http://dns-proxy:3053;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
            add_header Cache-Control "no-store";
        }

        # ── API: Single DNS query (used by DKIM probing) ──────────
        # GET /api/dns-query?name=example.com&type=TXT
        location = /api/dns-query {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://dns-proxy:3053/dns-query;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
            add_header Cache-Control "no-store";
        }

        # ── API: Admin endpoints ──────────────────────────────────
        # All /api/admin/* routes proxy to /admin/* on the dns-proxy.
        # Auth is enforced inside the dns-proxy via X-Admin-Hash header.
        # Rate limited to 20 req/s burst — admin actions are infrequent.
        # 32k body limit — larger than the global 4k to accommodate
        # saving SMTP config + multiple notification channels in one PUT.
        location /api/admin/ {
            limit_req zone=api burst=20 nodelay;
            client_max_body_size 32k;
            rewrite ^/api/admin/(.*) /admin/$1 break;
            proxy_pass http://dns-proxy:3053;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 15s;
            proxy_connect_timeout 5s;
            add_header Cache-Control "no-store";
        }

        # ── API: Multi-type DNS query (main public DNS lookup) ────
        # POST /api/dns-query-multi — resolves all record types in parallel.
        # Lower burst (10) since each request fires many DoH queries.
        location = /api/dns-query-multi {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://dns-proxy:3053/dns-query-multi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
            add_header Cache-Control "no-store";
        }

        # ── API: IP Geolocation ───────────────────────────────────
        # GET /api/geo?ip=1.2.3.4
        # Higher timeout (12s) because it may try two external providers.
        location = /api/geo {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://dns-proxy:3053/geo;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 12s;
            proxy_connect_timeout 5s;
            add_header Cache-Control "no-store";
        }

        # ── API: Blacklist check ──────────────────────────────────
        # GET /api/blacklist?ip=1.2.3.4
        # Routed through the same proxy pattern as other API endpoints.
        location = /api/blacklist {
            limit_req zone=checks burst=5 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://dns-proxy:3053;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
            add_header Cache-Control "no-store";
        }

        # ── API: TLS certificate check ────────────────────────────
        # GET /api/tls-check?domain=example.com
        location = /api/tls-check {
            limit_req zone=checks burst=5 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://dns-proxy:3053;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
            add_header Cache-Control "no-store";
        }

        # ── Internal: nginx stub status ───────────────────────────
        # Used by the stats page to show nginx connection metrics.
        # Restricted to private IP ranges only — never public.
        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;   # Docker bridge networks
            allow 10.0.0.0/8;      # Private class A
            allow 192.168.0.0/16;  # Private class C
            deny all;
            access_log off;
        }

        # ── Internal: server info ─────────────────────────────────
        # Returns nginx version, hostname, and time as JSON.
        # Used by the stats page server info panel.
        # Restricted to private IP ranges only.
        location = /server_info {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
            add_header Content-Type application/json;
            return 200 '{"nginx":"$nginx_version","hostname":"$hostname","time":"$time_iso8601"}';
            access_log off;
        }

        # ── Health check ──────────────────────────────────────────
        # Used by Docker healthcheck and load balancers.
        location = /health {
            return 200 'ok';
            add_header Content-Type text/plain;
            access_log off;
        }

        # ── Static asset caching ──────────────────────────────────
        # Cache CSS, JS, images, and fonts for 1 hour with must-revalidate.
        # IMPORTANT: add_header in a nested location replaces parent headers,
        # so we must repeat the security headers here.
        location ~* \.(css|js|png|jpg|ico|woff2?)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
